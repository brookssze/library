<style>
/* Layout: the public, read-only edition. Format tabs first (print selected), then search, then one clear table. Same Tinted palette as the private catalog. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#1e2a25; --muted:#56635c; --faint:#6e7a73; --rule:#e3e9e5; --rule2:#eef2ef; --field:#f7faf8; --soft:#f0f3f1;
  --accent:#3e6b57; --accent-ink:#ffffff; --accent-soft:#e3efe8; --accent-line:#8fb5a1; --accent-deep:#2c5040;
  --p-tint:#e5f2eb; --p-ink:#1f5e43; --k-tint:#fbefd9; --k-ink:#7f5110; --a-tint:#fbe6e0; --a-ink:#93361f; --l-tint:#e6ecfa; --l-ink:#2a4a98;
  --display:"Libre Caslon Display",Georgia,"Times New Roman",serif;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:40px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.row select{min-width:0;max-width:min(100%,260px)}
header{padding-bottom:20px;border-bottom:1px solid var(--rule)}
h1{font:400 clamp(34px,6vw,50px)/1 var(--display);margin:0;text-wrap:balance}
.intro{margin:14px 0 0;max-width:62ch;font:400 17px/1.55 var(--serif);color:var(--muted);text-wrap:pretty}
@media (max-width:640px){.intro{font-size:14.5px;line-height:1.5;margin-top:10px}}
input,select,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tab{border:2px solid transparent;border-radius:12px;padding:14px 18px;display:grid;gap:2px;text-align:left;cursor:pointer}
.tab b{font:400 30px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.tab span{font-size:14px;font-weight:600}
.tab.Print{background:var(--p-tint);color:var(--p-ink)} .tab.Kindle{background:var(--k-tint);color:var(--k-ink)}
.tab.Audible{background:var(--a-tint);color:var(--a-ink)} .tab.Logos{background:var(--l-tint);color:var(--l-ink)}
.tab.All{background:var(--soft);color:var(--ink)}
.tab[aria-pressed="true"]{border-color:currentColor;box-shadow:0 2px 0 currentColor}
.tab:hover{filter:brightness(.97)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#q{flex:1 1 280px;min-width:0;padding:12px 14px;border:1px solid var(--rule);background:var(--field);border-radius:10px}
select{padding:11px 12px;border:1px solid var(--rule);background:var(--field);border-radius:10px;max-width:100%}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.tabs.searching .tab span:last-child::after{content:" matches";font-weight:500}
.tabs.searching .tab[aria-pressed="false"]{opacity:.9}
.note{font-size:13px;color:var(--muted)}
.note button{border:0;background:none;color:var(--accent-deep);font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.tablebox{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
th[aria-sort="ascending"]::after{content:" ↑"} th[aria-sort="descending"]::after{content:" ↓"}
td{padding:13px 16px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.t{font:400 16px/1.35 var(--serif)}
.vol{font-size:12px;color:var(--faint);margin-left:8px;font-family:var(--body)}
.soon{display:inline-block;font:600 11px var(--body);padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:8px;vertical-align:2px}
.cat{color:var(--muted)}
.fmt{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.fmt.Print{background:var(--p-tint);color:var(--p-ink)} .fmt.Kindle{background:var(--k-tint);color:var(--k-ink)}
.fmt.Audible{background:var(--a-tint);color:var(--a-ink)} .fmt.Logos{background:var(--l-tint);color:var(--l-ink)}
.aud{font-size:12px;color:var(--faint);margin-left:6px}
.fmts{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.fmtgrp{display:inline-flex;align-items:center}
.fmt .x{font-weight:500;opacity:.8}
@media (min-width:641px){.fmts{min-width:210px}}
.setbtn{margin-top:8px;display:inline-flex;gap:7px;align-items:center;font:600 13px var(--body);color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:6px 12px;min-height:34px;cursor:pointer;box-shadow:0 1px 0 var(--accent-line)}
.setbtn:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setbtn .n{font-weight:400;opacity:.85}
.hits{margin-top:6px;font-size:12px;color:var(--muted)}
.hits b{color:var(--ink);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center}
.more button{border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
dialog{border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:14px;padding:0;width:min(720px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,15,14,.45)}
.cwrap{display:grid;gap:12px;padding:22px;max-height:min(80vh,820px);grid-template-rows:auto auto 1fr}
.chead{display:flex;justify-content:space-between;gap:12px;align-items:start}
.chead h2{font:400 26px/1.15 var(--display);margin:0;text-wrap:balance}
.csub{font-size:13px;color:var(--muted);margin-top:4px}
.close{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
#cq{width:100%;padding:11px 14px;border:1px solid var(--rule);background:var(--field);border-radius:10px}
.clist{overflow:auto;min-height:0;border-top:1px solid var(--rule)}
.clist details{border-bottom:1px solid var(--rule2)}
.clist summary{cursor:pointer;padding:11px 2px;font:600 14px var(--body);display:flex;justify-content:space-between;gap:10px}
.clist summary span{font-weight:400;font-size:13px;color:var(--muted)}
.clist ol{margin:0 0 12px;padding-left:2.4em;display:grid;gap:4px}
.clist li{font:400 15px/1.4 var(--serif)}
.clist li::marker{font:400 12px var(--body);color:var(--faint)}
.clist mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.cnone{padding:20px 2px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 6px 5px 13px;font-size:13px;font-weight:600}
.chip button{border:0;background:rgba(255,255,255,.22);color:inherit;width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1;font-size:16px;padding:0}
.chip button:hover{background:rgba(255,255,255,.38)}
select.on{border-color:var(--accent);background:var(--bg);font-weight:600}
@media (max-width:820px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .hide-sm{display:none}
  .wrap{padding-block:28px 48px;gap:18px}
  .tab{padding:10px 14px} .tab b{font-size:24px}
  #q{flex-basis:100%}
  .row select{flex:1 1 0;min-width:0}
  .tablebox{overflow:visible;border:0;border-radius:0;border-top:1px solid var(--rule)}
  table{min-width:0} thead{display:none}
  table,tbody,tr,td{display:block}
  tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 2px;border-bottom:1px solid var(--rule2)}
  tbody tr:last-child{border-bottom:0}
  td{padding:0;border:0}
  td:first-child{flex:1 0 100%}
  td.au{font-size:13px;color:var(--muted)}
  td.hide-sm{display:none}
  .fmt{font-size:12px;padding:1px 8px;border-radius:5px}
}
</style>
</head>

<div class="wrap">
  <header><h1>Brooks's Library</h1><p class="intro">I put my library online so friends can see what I have. Some of these I&rsquo;d commend in a heartbeat, some I&rsquo;d never recommend, and there&rsquo;s everything in between. I&rsquo;m always happy to talk books.</p></header>

</dialog>

ar properties","3.3 Regeneration by faith. Of repentance","3.4 Penitence, as explained in the sophistical jargon of the Schoolmen, widely different from the purity required by the Gospel. Of confession and satisfaction","3.5 Of the modes of supplementing satisfaction — viz. Indulgences and purgatory","3.6 The life of a Christian man. Scriptural arguments exhorting to it","3.7 A summary of the Christian life. Of self-denial","3.8 Of bearing the cross — one branch of self-denial","3.9 Of meditating on the future life","3.10 How to use the present life, and the comforts of it","3.11 Of justification by faith. Both the name and the reality defined","3.12 Necessity of contemplating the judgment-seat of God, in order to be seriously convinced of the doctrine of gratuitous justification","3.13 Two things to be observed in gratuitous justification","3.14 The beginning of justification. In what sense progressive","3.15 The boasted merit of works subversive both of the glory of God, in bestowing righteousness, and of the certainty of salvation","3.16 Refutation of the calumnies by which it is attempted to throw odium on this doctrine","3.17 The promises of the law and the Gospel reconciled","3.18 The righteousness of works improperly inferred from rewards","3.19 Of Christian liberty","3.20 Of prayer — a perpetual exercise of faith. The daily benefits derived from it","3.21 Of the eternal election, by which God has predestinated some to salvation, and others to destruction","3.22 This doctrine confirmed by proofs from Scripture","3.23 Refutation of the calumnies by which this doctrine is always unjustly assailed","3.24 Election confirmed by the calling of God. The reprobate bring upon themselves the righteous destruction to which they are doomed","3.25 Of the last resurrection"],"label":"Book III · How We Receive the Grace of Christ"},{"items":["4.1 Of the true church. Duty of cultivating unity with her, as the mother of all the godly","4.2 Comparison between the false church and the true","4.3 Of the teachers and ministers of the church. Their election and office","4.4 Of the state of the primitive church, and the mode of government in use before the papacy","4.5 The ancient form of government utterly corrupted by the tyranny of the papacy","4.6 Of the primacy of the Romish See","4.7 Of the beginning and rise of the Romish papacy, till it attained a height by which the liberty of the church was destroyed, and all true rule overthrown","4.8 Of the power of the church in articles of faith. The unbridled licence of the papal church in destroying purity of doctrine","4.9 Of councils and their authority","4.10 Of the power of making laws. The cruelty of the Pope and his adherents, in this respect, in tyrannically oppressing and destroying souls","4.11 Of the jurisdiction of the church, and the abuses of it, as exemplified in the papacy","4.12 Of the discipline of the church, and its principal use in censures and excommunication","4.13 Of vows. The miserable entanglements caused by vowing rashly","4.14 Of the sacraments","4.15 Of baptism","4.16 Pædobaptism. Its accordance with the institution of Christ, and the nature of the sign","4.17 Of the Lord's Supper, and the benefits conferred by it","4.18 Of the Popish mass. How it not only profanes, but annihilates the Lord's Supper","4.19 Of the five sacraments, falsely so called. Their spuriousness proved, and their true character explained","4.20 Of civil government"],"label":"Book IV · The Church and the Means of Grace"}]},"matthew-henry":{"title":"Matthew Henry's Commentary on the Whole Bible (6 vols.)","author":"Matthew Henry","unit":"Bible books","note":"Your MacDonald print set and your Kindle edition follow the same six-volume layout.","volumes":[{"items":["Genesis","Exodus","Leviticus","Numbers","Deuteronomy"],"label":"Vol. I · Genesis to Deuteronomy"},{"items":["Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther"],"lab "A Silly Dove","Our Banner","Our Champion","The Fainting Hero","Women's Rights—A Parable","Black Clouds and Bright Blessings","David's First Victory","David and His Volunteers"],"label":"Vol. 12"}]},"spurgeon-sermons":{"title":"Spurgeon's Sermons (10 vols. in 5 books)","author":"C. H. Spurgeon","unit":"sermons","note":"Each green book holds two volumes: Book 1 = Vols. 1–2, Book 2 = Vols. 3–4, and so on.","volumes":[{"items":["Sovereignty and salvation","The Bible","The personality of the Holy Ghost","The Comforter","Christ crucified","The power of the Holy Ghost","The church of Christ","The eternal name","Paul's first prayer","Joseph attacked by the archers","The tomb of Jesus","The carnal mind enmity against God","Christ's people—imitators of Him","Thoughts on the last battle","Heaven and Hell","Gospel missions","The enchanted ground","Faith"],"label":"Vol. 1 · Book 1"},{"items":["The glorious habitation","Healing for the wounded: a sermon for the Crimean soldiers","The peculiar sleep of the beloved","The sin of unbelief","Election","The house of mourning, and the house of feasting","The day of atonement","The allegories of Sarah and Hagar","The exaltation of Christ","The saint's heritage and watchword","Songs in the night","God's providence","A view of God's glory","Confirming the witness of Christ","Harvest time","Sweet comfort for feeble saints","The resurrection of the dead","The curse removed","The comer's conflict with Satan","Christ—the Rock","A visit to Calvary","Teaching children","The God of the aged","Omniscience","Christ in the Covenant","Love's commendation","Turn or burn"],"label":"Vol. 2 · Book 1"},{"items":["A faithful friend","The leafless tree","The snare of the fowler","The fruitless vine","Spiritual revival the want of the church","The anxious inquirer","The sinner's refuge","The dumb singing","Foretastes of the heavenly life","Preaching for the poor","Secret sins","Elijah's appeal to the undecided","Salvation of the Lord","Regeneration","Spiritual resurrection","Confession of sin","Faith","Rahab's faith","The blood-shedding","Justification by grace","Manasseh","Why are men saved?","Particular election","Mercy, omnipotence, and justice","Christ—the power and wisdom of God","Going home—a Christmas sermon","A mighty savior","Israel in Egypt","Presumptuous sins"],"label":"Vol. 3 · Book 2"},{"items":["The parable of the Ark","Proving God","Meditation on God","Pardon and justification","The Good Shepherd","The gracious lips of Jesus","A time of finding for lost sheep","The two talents","Prodigal's return","God, the All-Seeing One","The immutability of Christ","Paul's sermon before Felix","The death of Christ","A call to the unconverted","The warning neglected","\"What have I done?\"","Light at evening time","The Redeemer","The first and great commandment","Awake! Awake!","The loved ones chastened","Fear not","The condescension of Christ","The great reservoir","How to keep the heart","Human inability","Love thy neighbor"],"label":"Vol. 4 · Book 2"},{"items":["His name—Wonderful","His name—the Counselor","\"As thy days, so shall thy strength be\"","The voice of the blood of Christ","The new heart","The fatherhood of God","Everybody's sermon","A lecture for Little-Faith","Confession and absolution","Declension from first love","God's barriers against man's sin","Comfort proclaimed","The Christian's heaviness and rejoicing","The evil and its remedy","Samson conquered","Looking unto Jesus","Satan's banquet","The feast of the Lord","The blood","Love","The great revival","The form and spirit of religion","Providence","The vanguard and rereward of the church","The world turned upside down","Human responsibility","Faith in perfection"],"label":"Vol. 5 · Book 3"},{"items":["The story of God's mighty acts","The outpouring of the Holy Spirit","The sympathy of the two worlds","The conversion of Saul of Tarsus","Distinguishing grace","The mission of the Son of Man","An earnest invitation","How saints may help the devil","His  Bethesda; or, waiting changed for believing","The unsearchable riches of Christ","The end of the righteous desired","Number one thousand; or, \"Bread enough to spare\"","Love's logic","Altogether lovely","The alarum","The withering work of the Holy Spirit","Marah; or, the bitter waters sweetened","Negotiations for peace","Jesus only","Rest, rest","Carried by four","Jesus no phantom","Very singular"],"label":"Vol. 9 · Book 5"},{"items":["The matchless mystery","Marrow and fatness","Additions to the church","A lesson from the life of King Asa","\"Without money and without price\"","Questions of the day and the question of the day","The monster dragged to light","An old-fashioned conversion","Harvest men wanted","The Father's will","How a man's conduct comes home to him","The priest dispensed with","The sacred love-token","The lion-slayer—the giant-killer","The God of Bethel","The story of a runaway slave","\"Lovest thou me?\"","My God","The little dogs","Aeneas"],"label":"Vol. 10 · Book 5"}]}},"top":[{"n":"R. C. Sproul","k":"r c sproul"},{"n":"Joel R. Beeke","k":"joel r beeke"},{"n":"Douglas Wilson","k":"douglas wilson"},{"n":"C. H. Spurgeon","k":"c h spurgeon"},{"n":"John Piper","k":"john piper"},{"n":"John Calvin","k":"john calvin"},{"n":"Thomas Brooks","k":"thomas brooks"},{"n":"Thomas Boston","k":"thomas boston"},{"n":"William Perkins","k":"william perkins"},{"n":"J. C. Ryle","k":"j c ryle"}]}</script>
<script>
const $=id=>document.getElementById(id);
const DATA=JSON.parse($('lib-data').textContent);
const books=DATA.books, sets=DATA.sets;
const st={q:'',cat:'',au:'',fmt:'',sfmt:'',sort:'t',dir:1,limit:200};
const FMTS=['Print','Kindle','Audible','Logos'],FORD={Print:0,Kindle:1,Audible:2,Logos:3};
const cp=b=>b.n||1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=s=>(s||'').toLowerCase().replace(/^(the|a|an)\s+/,'').replace(/[^a-z0-9 ]/g,'');

$('cat').innerHTML='<option value="">All categories</option>'+[...new Set(books.map(b=>b.c).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join('');

// Authors: split co-authors, normalise spellings, then offer the 10 most-collected first and everyone else A–Z.
const AL={"charles h spurgeon":"c h spurgeon","charles haddon spurgeon":"c h spurgeon","charles spurgeon":"c h spurgeon","john f macarthur jr":"john macarthur","john f macarthur":"john macarthur","joel beeke":"joel r beeke","saint augustine of hippo":"augustine","augustine saint":"augustine"};
const akey=n=>{n=n.toLowerCase().replace(/\(ed\.?\)/g,'').replace(/[.,']/g,' ').replace(/\s+/g,' ').trim();return AL[n]||n};
const asplit=a=>(a||'').replace(/\bet al\.?/g,'').split(/\s*&\s*|\s*;\s*|\s*,\s*|\s+with\s+/).map(x=>x.trim()).filter(x=>x&&!/^(jr\.?|sr\.?|ii|iii)$/i.test(x));
const AU={};
books.forEach(b=>{b.k=new Set();asplit(b.a).forEach(n=>{const k=akey(n);if(k.length<3)return;b.k.add(k);const e=AU[k]||(AU[k]={sp:{},n:0});const nm=n.replace(/\(ed\.?\)/,'').trim();e.sp[nm]=(e.sp[nm]||0)+1});b.k.forEach(k=>AU[k].n+=cp(b))});
// One line per book: copies of the same edition in different formats share b.w and are counted individually.
const LM=new Map();books.forEach((b,i)=>{const k=b.w||'i'+i;if(!LM.has(k))LM.set(k,[]);LM.get(k).push(b)});
const LINES=[...LM.values()].map(rows=>{rows.sort((x,y)=>FORD[x.f]-FORD[y.f]);return{rows,p:rows[0],s:(rows.find(r=>r.s)||{}).s,o:rows.some(r=>r.o)}});
const aname=k=>Object.entries(AU[k].sp).sort((x,y)=>y[1]-x[1])[0][0];
const TOP=(DATA.top||[]).filter(t=>AU[t.k]).map(t=>({k:t.k,name:t.n})); // already ranked by volumes owned
TOP.forEach(t=>AU[t.k].name=t.name);
Object.keys(AU).forEach(k=>{if(!AU[k].name)AU[k].name=aname(k)});
const opt=k=>`<option value="${esc(k)}">${esc(AU[k].name)} (${AU[k].n})</option>`;
$('au').innerHTML='<option value="">All authors</option>'+(TOP.length?`<optgroup label="Most collected">${TOP.map(t=>`<option value="${esc(t.k)}">${esc(t.name)}</option>`).join('')}</optgroup>`:'')+`<optgroup label="All authors A–Z">${Object.keys(AU).sort((x,y)=>key(AU[x].name).localeCompare(key(AU[y].name))).map(opt).join('')}</optgroup>`;

function hitsFor(L,q){const S=sets[L.s];if(!S||q.length<3)return[];const h=[];for(const v of S.volumes)for(const t of v.items)if(t.toLowerCase().includes(q))h.push([t,v.label]);return h}
function render(){
  const q=st.q.trim().toLowerCase();
  const searching=q.length>0;
  const matched=LINES.filter(L=>(!st.cat||L.rows.some(b=>b.c===st.cat))&&(!st.au||L.rows.some(b=>b.k.has(st.au)))&&(!q||L.rows.some(b=>[b.t,b.a,b.p,b.c].join(' ').toLowerCase().includes(q))||hitsFor(L,q).length));
  const tot={All:0};FMTS.forEach(f=>tot[f]=0);matched.forEach(L=>L.rows.forEach(b=>{tot[b.f]+=cp(b);tot.All+=cp(b)}));
  FMTS.forEach(f=>$('n'+f).textContent=tot[f].toLocaleString());$('nAll').textContent=tot.All.toLocaleString();
  const fmt=searching?st.sfmt:st.fmt;
  let list=matched.filter(L=>!fmt||L.rows.some(b=>b.f===fmt));
  const nShown=tot[fmt||'All'];
  $('tabs').classList.toggle('searching',searching);
  $('note').innerHTML=searching?(st.sfmt?`Showing ${esc(st.sfmt)} matches only.`:'Searching all formats. Tap a format above to narrow.'):'';
  list.sort((x,y)=>(key(x.p[st.sort]).localeCompare(key(y.p[st.sort]))||key(x.p.t).localeCompare(key(y.p.t)))*st.dir);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.f===fmt)));
  document.querySelectorAll('th').forEach(th=>th.setAttribute('aria-sort',th.dataset.k===st.sort?(st.dir>0?'ascending':'descending'):'none'));
  $('chips').innerHTML=(st.au?`<span class="chip">Author: ${esc(AU[st.au].name)} <button type="button" data-clear="au" aria-label="Remove author filter">×</button></span>`:'')+(st.cat?`<span class="chip">Category: ${esc(st.cat)} <button type="button" data-clear="cat" aria-label="Remove category filter">×</button></span>`:'');
  $('au').value=st.au;$('au').classList.toggle('on',!!st.au);$('cat').value=st.cat;$('cat').classList.toggle('on',!!st.cat);
  $('count').textContent=`${nShown.toLocaleString()} ${nShown===1?'book':'books'}`;
  const shown=list.slice(0,st.limit);
  $('rows').innerHTML=shown.map(L=>{const b=L.p;const S=sets[L.s];const h=hitsFor(L,q);
    const fm=FMTS.map(f=>{const rs=L.rows.filter(r=>r.f===f);if(!rs.length)return'';const n=rs.reduce((t,r)=>t+cp(r),0);return `<span class="fmtgrp"><span class="fmt ${f}">${f}${n>1?` <span class="x">×${n}</span>`:''}</span>${rs.some(r=>r.au)?'<span class="aud">+ audio</span>':''}</span>`}).join('');
    const n=S?S.volumes.reduce((a,v)=>a+v.items.length,0):0;
    return `<tr><td><div class="t">${esc(b.t)}${L.o?'<span class="soon">Arriving soon</span>':''}</div>${S?`<div><button class="setbtn" type="button" data-set="${esc(L.s)}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>View contents <span class="n">· ${n} ${esc(S.unit||'titles')}</span> <span aria-hidden="true">→</span></button></div>`:''}${h.length?`<div class="hits">Contains ${h.slice(0,3).map(([t,v])=>`<b>${esc(t)}</b> (${esc(v)})`).join(', ')}${h.length>3?` and ${h.length-3} more`:''}</div>`:''}</td>
    <td class="au">${esc(b.a)}</td><td class="hide-sm cat">${esc(b.c)}</td><td><span class="fmts">${fm}</span></td></tr>`}).join('');
  $('empty').hidden=list.length>0;
  $('moreBtn').hidden=list.length<=st.limit;
}
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;if(st.q.trim())st.sfmt=t.dataset.f;else st.fmt=t.dataset.f;st.limit=200;render()});
$('note').addEventListener('click',e=>{if(e.target.id==='showAll'){st.sfmt='';render()}});
$('q').addEventListener('input',e=>{const was=st.q.trim();st.q=e.target.value;if(!was&&st.q.trim())st.sfmt='';st.limit=200;render()});
$('cat').addEventListener('change',e=>{st.cat=e.target.value;st.limit=200;render()});
$('au').addEventListener('change',e=>{st.au=e.target.value;st.limit=200;render()});
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-clear]');if(!b)return;st[b.dataset.clear]='';st.limit=200;render()});
$('moreBtn').addEventListener('click',()=>{st.limit+=300;render()});
document.querySelector('thead').addEventListener('click',e=>{const th=e.target.closest('th');if(!th)return;if(st.sort===th.dataset.k)st.dir*=-1;else{st.sort=th.dataset.k;st.dir=1}render()});
let cur=null;
function hl(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function drawSet(){const S=sets[cur];const q=$('cq').value.trim().toLowerCase();
  $('cList').innerHTML=S.volumes.map(v=>{const its=v.items.map((t,i)=>[t,i]).filter(([t])=>!q||t.toLowerCase().includes(q));if(!its.length)return'';
    return `<details open><summary>${esc(v.label)}<span>${q?its.length+' of '+v.items.length:v.items.length}</span></summary><ol>${its.map(([t,i])=>`<li value="${i+1}">${hl(t,q)}</li>`).join('')}</ol></details>`}).join('')||`<div class="cnone">Nothing in this set matches “${esc(q)}”.</div>`}
$('rows').addEventListener('click',e=>{const b=e.target.closest('.setbtn');if(!b)return;cur=b.dataset.set;const S=sets[cur];
  $('cTitle').textContent=S.title;const n=S.volumes.reduce((a,v)=>a+v.items.length,0);
  $('cSub').textContent=[S.author,`${n} ${S.unit||'titles'}${S.volumes.length>1?` in ${S.volumes.length} ${S.groups||'volumes'}`:''}`].filter(Boolean).join(' · ');
  const q0=st.q.trim().toLowerCase();$('cq').value=q0.length>=3&&S.volumes.some(v=>v.items.some(t=>t.toLowerCase().includes(q0)))?st.q.trim():'';
  drawSet();$('cdlg').showModal()});
$('cq').addEventListener('input',drawSet);
$('cClose').addEventListener('click',()=>$('cdlg').close());
render();
</script>
